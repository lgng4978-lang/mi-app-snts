<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNTS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root {
            --fondo-oscuro: #000000;
            --fondo-barra: #12121F;
            --fondo-buscar: #1A1A2E;
            --texto-blanco: #F0F0FF;
            --texto-gris: #A0A0C0;
            --morado-principal: #7B2CBF;
            --morado-claro: #9D4EDD;
            --morado-oscuro: #5A189A;
            --borde-morado: #C77DFF;
            --brillo-morado: rgba(123, 44, 191, 0.6);
            --azul-verificado: #34B7F1;
            --en-linea: #00FF88;
        }
        body { background: var(--fondo-oscuro); color: var(--texto-blanco); min-height: 100vh; }

        .avatar-wrapper { position: relative; display: inline-block; }
        .verificado-badge {
            position: absolute; top: -3px; right: -3px;
            width: 18px; height: 18px;
            background: var(--azul-verificado);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--fondo-oscuro); z-index: 10;
        }
        .verificado-badge::after { content: '✓'; color: white; font-size: 10px; font-weight: bold; }
        .en-linea-punto {
            position: absolute; bottom: 2px; right: 2px;
            width: 12px; height: 12px;
            background: var(--en-linea); border-radius: 50%;
            border: 2px solid var(--fondo-oscuro);
            box-shadow: 0 0 6px var(--en-linea);
        }

        .barra-sup {
            background: var(--fondo-barra); padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--borde-morado);
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
        }
        .logo-snts { font-size: 20px; font-weight: bold; color: var(--morado-claro); }
        .barra-acciones { display: flex; gap: 16px; align-items: center; }
        .icono-barra { font-size: 20px; cursor: pointer; color: var(--texto-gris); padding: 8px; }
        .icono-barra:hover { color: var(--morado-claro); background: var(--fondo-buscar); border-radius: 50%; }

        .pestanas { display: flex; margin-top: 60px; background: var(--fondo-barra); border-bottom: 1px solid var(--morado-oscuro); }
        .pestana { 
            flex: 1; padding: 12px; text-align: center; cursor: pointer; 
            color: var(--texto-gris); border-bottom: 3px solid transparent;
            font-size: 15px;
        }
        .pestana.activa { color: var(--morado-claro); border-bottom: 3px solid var(--morado-claro); }

        .pantalla-registro {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
            background: radial-gradient(circle at top, #1A1A2E 0%, #000000 70%);
        }
        .pantalla-registro h1 { color: var(--morado-claro); font-size: 42px; margin-bottom: 10px; }
        .pantalla-registro p { color: var(--texto-gris); margin-bottom: 30px; text-align: center; }
        .contenedor-registro { width: 100%; max-width: 400px; }
        .selector-pais { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .selector-pais select, .selector-pais input {
            width: 100%; padding: 14px;
            background: var(--fondo-buscar); border: 2px solid var(--morado-oscuro);
            border-radius: 8px; color: var(--texto-blanco); font-size: 16px; outline: none;
        }
        .btn-principal {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--morado-oscuro), var(--morado-principal));
            color: white; border: 2px solid var(--borde-morado);
            border-radius: 8px; font-size: 17px; cursor: pointer;
        }
        .btn-principal:active { transform: scale(0.98); }

        .pantalla-principal { display: none; min-height: 100vh; }
        .contenido-pestana { display: none; padding: 16px; padding-bottom: 90px; padding-top: 10px; }
        .contenido-pestana.activa { display: block; }

        .chat-item {
            display: flex; padding: 14px 12px; border-bottom: 1px solid var(--morado-oscuro);
            cursor: pointer; border-radius: 6px; margin-bottom: 4px;
        }
        .chat-item:active { background: var(--fondo-buscar); }
        .avatar-chat {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, var(--morado-oscuro), var(--morado-principal));
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; border: 2px solid var(--borde-morado); position: relative;
        }
        .chat-info { flex: 1; padding-left: 12px; }
        .nombre-usuario {
            font-size: 16px; font-weight: 500; display: flex;
            align-items: center; gap: 5px; color: var(--texto-blanco);
        }
        .mensaje-chat { font-size: 13px; color: var(--texto-gris); margin-top: 4px; }

        .estado-item {
            display: flex; align-items: center; padding: 12px;
            border-radius: 8px; margin-bottom: 8px; cursor: pointer;
        }
        .estado-item:active { background: var(--fondo-buscar); }
        .estado-anillo {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            padding: 2px; margin-right: 12px;
        }
        .estado-avatar {
            width: 100%; height: 100%; border-radius: 50%;
            background: var(--fondo-buscar); display: flex;
            align-items: center; justify-content: center; font-size: 20px;
        }
        .btn-subir-estado { border: 2px dashed var(--morado-claro); justify-content: center; gap: 8px; }

        .contacto-item {
            display: flex; align-items: center; padding: 12px;
            border-bottom: 1px solid var(--morado-oscuro); cursor: pointer;
        }
        .contacto-item:active { background: var(--fondo-buscar); }

        .btn-agregar {
            position: fixed; bottom: 30px; right: 20px;
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--morado-oscuro), var(--morado-principal));
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 0 15px var(--brillo-morado); z-index: 50;
        }
    </style>
</head>
<body>

<!-- PANTALLA DE REGISTRO -->
<div class="pantalla-registro" id="pantalla-registro">
    <h1>SNTS</h1>
    <p>Ingresa tu número para comenzar</p>
    <div class="contenedor-registro">
        <div class="selector-pais">
            <select id="pais">
                <option value="+502" selected>🇬🇹 Guatemala +502</option>
                <option value="+503">🇸🇻 El Salvador +503</option>
                <option value="+504">🇭🇳 Honduras +504</option>
                <option value="+505">🇳🇮 Nicaragua +505</option>
                <option value="+506">🇨🇷 Costa Rica +506</option>
                <option value="+507">🇵🇦 Panamá +507</option>
                <option value="+52">🇲🇽 México +52</option>
                <option value="+54">🇦🇷 Argentina +54</option>
                <option value="+51">🇵🇪 Perú +51</option>
                <option value="+591">🇧🇴 Bolivia +591</option>
                <option value="+55">🇧🇷 Brasil +55</option>
                <option value="+56">🇨🇱 Chile +56</option>
                <option value="+57">🇨🇴 Colombia +57</option>
                <option value="+53">🇨🇺 Cuba +53</option>
                <option value="+593">🇪🇨 Ecuador +593</option>
                <option value="+595">🇵🇾 Paraguay +595</option>
                <option value="+1">🇩🇴 República Dominicana +1</option>
                <option value="+598">??🇾 Uruguay +598</option>
                <option value="+58">🇻🇪 Venezuela +58</option>
                <option value="+1">🇺🇸 Estados Unidos +1</option>
                <option value="+34">🇪🇸 España +34</option>
            </select>
            <input type="tel" id="numero" placeholder="Escribe tu número">
        </div>
        <button class="btn-principal" onclick="verificar()">Continuar</button>
    </div>
</div>

<!-- PANTALLA PRINCIPAL -->
<div class="pantalla-principal" id="pantalla-principal">
    <div class="barra-sup">
        <span class="logo-snts">SNTS</span>
        <div class="barra-acciones">
            <span class="icono-barra">🔍</span>
            <span class="icono-barra">⋮</span>
        </div>
    </div>

    <div class="pestanas">
        <div class="pestana activa" id="tab-chats" onclick="cambiarPestana('chats')">Chats</div>
        <div class="pestana" id="tab-estados" onclick="cambiarPestana('estados')">Estados</div>
        <div class="pestana" id="tab-canales" onclick="cambiarPestana('canales')">Canales</div>
        <div class="pestana" id="tab-contactos" onclick="cambiarPestana('contactos')">Contactos</div>
    </div>

    <!-- Chats -->
    <div class="contenido-pestana activa" id="pestana-chats">
        <div class="chat-item">
            <div class="avatar-wrapper">
                <div class="avatar-chat">👤</div>
                <div class="en-linea-punto"></div>
            </div>
            <div class="chat-info">
                <div class="nombre-usuario">Usuario Ejemplo <span class="verificado-badge"></span></div>
                <div class="mensaje-chat">¡Hola! ¿Cómo estás?</div>
            </div>
        </div>
    </div>

    <!-- Estados -->
    <div class="contenido-pestana" id="pestana-estados">
        <div class="estado-item btn-subir-estado">
            <div class="estado-anillo"><div class="estado-avatar">➕</div></div>
            <div>
                <div style="font-weight:500">Mi estado</div>
                <div style="font-size:12px;color:var(--texto-gris)">Toca para añadir estado</div>
            </div>
        </div>
        <div class="estado-item">
            <div class="estado-anillo"><div class="estado-avatar">👩</div></div>
            <div>
                <div style="font-weight:500">María</div>
                <div style="font-size:12px;color:var(--texto-gris)">Hace 10 minutos</div>
            </div>
        </div>
    </div>

    <!-- Canales -->
    <div class="contenido-pestana" id="pestana-canales">
        <p style="text-align:center;color:var(--texto-gris);margin-top:40px;">📢 Aquí aparecerán tus canales</p>
    </div>

    <!-- Contactos -->
    <div class="contenido-pestana" id="pestana-contactos">
        <p style="text-align:center;color:var(--texto-gris);margin-top:40px;">👥 Aquí aparecerán tus contactos</p>
    </div>

    <div class="btn-agregar" title="Agregar">+</div>
</div>

<script>
// ✅ REVISAR SI YA ESTÁS REGISTRADO (NO PIDE EL NÚMERO OTRA VEZ)
window.onload = function() {
    const guardado = localStorage.getItem('usuarioSNTS');
    if (guardado) {
        // Ya está guardado → ir directo a la app
        document.getElementById('pantalla-registro').style.display = 'none';
        document.getElementById('pantalla-principal').style.display = 'block';
    }
};

// ✅ VERIFICAR Y GUARDAR EL NÚMERO
function verificar() {
    var numero = document.getElementById('numero').value;
    var pais = document.getElementById('pais').value;
    
    if (numero.length < 4) {
        alert('⚠️ Escribe un número válido');
    } else {
        // Guardar para que no lo pida otra vez
        localStorage.setItem('usuarioSNTS', pais + ' ' + numero);
        alert('✅ ¡Bienvenido a SNTS! 🎉');
        document.getElementById('pantalla-registro').style.display = 'none';
        document.getElementById('pantalla-principal').style.display = 'block';
    }
}

// ✅ CAMBIAR ENTRE PESTAÑAS — ARREGLADO
function cambiarPestana(nombre) {
    // Quitar activa de todas las pestañas
    document.querySelectorAll('.pestana').forEach(p => p.classList.remove('activa'));
    // Quitar activa de todos los contenidos
    document.querySelectorAll('.contenido-pestana').forEach(c => c.classList.remove('activa'));
    // Activar la seleccionada
    document.getElementById('tab-' + nombre).classList.add('activa');
    document.getElementById('pestana-' + nombre).classList.add('activa');
}
</script>

</body>
</html>
